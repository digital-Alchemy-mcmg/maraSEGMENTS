<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage B Harness</title><style>body{font-family:system-ui;background:#fafbfc;color:#111827;margin:0}.w{max-width:1500px;margin:auto;padding:24px}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.c{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:white}textarea{width:100%;height:330px;box-sizing:border-box;font:12px ui-monospace,monospace;padding:10px;border:1px solid #d1d5db;border-radius:8px}button{width:100%;padding:13px;margin:16px 0;background:#111827;color:white;border:0;border-radius:9px;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace}.bad{color:#b91c1c}.ok{color:#047857}@media(max-width:1000px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>Spatial DNA Pipeline — Stage B</h1><p>Requires three authoritative inputs. No embedded candidate, target, evidence, fallback, or auto-population exists.</p><div class="g"><div class="c"><h3>Stage A Envelope JSON</h3><textarea id="env" aria-label="Stage A envelope JSON"></textarea></div><div class="c"><h3>Stage A Sidecar JSON</h3><textarea id="side" aria-label="Stage A sidecar JSON"></textarea></div><div class="c"><h3>Candidate SDNA YAML</h3><textarea id="sdna" aria-label="Candidate SDNA YAML"></textarea></div></div><button id="run">EXECUTE B1 → B5 → T06 → TERMINATION</button><div class="c"><h3 id="status">AWAITING AUTHORITATIVE INPUTS</h3><pre id="out"></pre></div></div><script>run.onclick=async()=>{status.className='';out.textContent='';try{if(!env.value.trim()||!side.value.trim()||!sdna.value.trim())throw new Error('All three authoritative inputs are required.');let payload={envelope:JSON.parse(env.value),sidecar:JSON.parse(side.value),candidate_sdna_yaml:sdna.value};status.textContent='RUNNING';let r=await fetch('/api/stage_b',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json();status.textContent=r.ok?'STAGE_B_COMPLETED':'HALTED_B';status.className=r.ok?'ok':'bad';out.textContent=JSON.stringify(j,null,2)}catch(e){status.textContent='HALTED_B';status.className='bad';out.textContent=String(e)}}</script></body></html>
